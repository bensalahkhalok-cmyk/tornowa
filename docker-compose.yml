version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: league_postgres
    environment:
      POSTGRES_USER: league_user
      POSTGRES_PASSWORD: league_password
      POSTGRES_DB: league_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - league_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: league_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@league.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - league_network

networks:
  league_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
